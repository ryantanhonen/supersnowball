name: Monitor CBA policy rate

on:
  schedule:
    # Every 30 minutes. NOTE: GitHub only runs scheduled workflows on the
    # repository's DEFAULT branch, and cron timing is best-effort (can be
    # delayed under load). This must be on the default branch to fire.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Allow the job to commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: monitor-cba-rate
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monitor/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check CBA press releases
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor/scrape.py

      - name: Upload debug page (if scrape found nothing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last_page
          path: monitor/last_page.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        run: |
          if [[ -n "$(git status --porcelain monitor/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add monitor/state.json
            git commit -m "chore: update CBA monitor state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
